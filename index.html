<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netahako / ねたはこ</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #555555;
      --border: #dddddd;
      --link: #0060c0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1a1a;
        --text: #e8e8e8;
        --muted: #aaaaaa;
        --border: #444444;
        --link: #6ab0f5;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1a1a;
      --text: #e8e8e8;
      --muted: #aaaaaa;
      --border: #444444;
      --link: #6ab0f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 40px 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: var(--muted); margin-bottom: 24px; }
    nav { display: flex; flex-direction: column; gap: 12px; }
    nav a {
      display: block;
      color: var(--link);
      text-decoration: none;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    nav a:hover { text-decoration: underline; }
    footer {
      margin-top: 48px;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <h1>netahako / ねたはこ</h1>
  <p>思いつきを貯める、カード式ネタ帳アプリです。<br>
  A card-based idea notebook app for writers.</p>
  <nav>
    <a href="privacy/">プライバシーポリシー / Privacy Policy</a>
    <a href="support/">サポート / Support</a>
  </nav>
  <footer>© 2026 Studio_Yoru</footer>
</body>
</html>
